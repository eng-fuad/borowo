<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-App</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #121212;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container{
            background-color: #1e1e1e;
            width: 360px;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
        }
        h1, h2{
            margin-bottom: 20px;
        }
        ul{
            list-style-type: none;
            /* margin-bottom: 5px; */
        }
        li{
            background-color: #333333;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            
        }
        li:hover{
            background-color: #3700b3;
        }
        
        button{
            background-color: #6200ea;
            padding: 10px;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin-bottom: 5px;
            cursor: pointer;
             transition: background-color 0.3s;
        }
        button:hover{
            background-color: #3700b3;
        }

        .hidden{
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quiz-App</h1>
        <div id="container-Quiz">
            <div id="question-Quiz" class="hidden">
                <h2 id="Question-tittle"></h2>
                <ul id="ul-list">
             <!-- lists dynamically added here -->
                </ul>
                <button id="next-btn" class="hidden">Next-Question</button>
            </div>
            <div id="last-result" class="hidden">
                <h2> Your Score:</h2>
                <p id="score">69</p>
                <button id="restart-btn">Restart-Question</button>
            </div>
            <button id="start-btn">start-Quiz</button>
        </div>
    </div>

    <script>

        document.addEventListener("DOMContentLoaded", () =>{
      const containerQuiz = document.getElementById("container-Quiz")
      const questionQuiz = document.getElementById("question-Quiz")
      const QuestionTittle = document.getElementById("Question-tittle")
      const ulLists = document.getElementById("ul-list")
      const nextBtn = document.getElementById("next-btn")
      const lastResult = document.getElementById("last-result")
      const scoreMessageDisplay = document.getElementById("score")
      const restartBtn = document.getElementById("restart-btn")
      const startBtn = document.getElementById("start-btn")
      
      const allQuestions = [
        {question: " kitaabka ugu dambeeya ee ilaahy soo dejiyey waa kee?",
            choices: [ "A) Tawreed", "B) Injiil", "C) Zabuur", "D) Qur,aan"],
            answer: "D) Qur,aan"
        },
        {question: "Which sea is the largest in the world?",
            choices: ["A) Red Sea", "B) Mediterranean Sea", "C) Pacific Occean", "D) Caribbean Sea"],
            answer: "C) Pacific Occean"
        },
        {question: "Nabiga ugu dambeya waa kee?",
            choices: ["A) Nabi Muuse (CS)", "B) Nabi Ciise (CS)", "C) Nabi Maxamed (NNKH)", "D) Nabi Ibrahim (CS)"],
            answer: "C) Nabi Maxamed (NNKH)"
        },
        {question: "Meesha ugu barakada badan ee islaamka waa?",
            choices: ["A) Masjidul Aqsa", "B) Masjidul Quba", "C) Masjidul Xaram", "D) Masjidul Nabawi"],
            answer: "C) Masjidul Xaram"
        },
      ]

      let currentQuestionIndex = 0
      let score = 0
      startBtn.addEventListener("click", starQuiz)
       function starQuiz() {
        startBtn.classList.add("hidden")
        lastResult.classList.add("hidden")
        questionQuiz.classList.remove("hidden")
        showQuiz()
       }

       function showQuiz() {
           ulLists.innerHTML= ""
        nextBtn.classList.add("hidden")
        QuestionTittle.textContent = allQuestions[currentQuestionIndex].question
        allQuestions[currentQuestionIndex].choices.forEach(choice =>{
            const li = document.createElement("li")
            li.textContent = choice
            li.addEventListener("click", () => selectAnswer(choice))
            
            ulLists.appendChild(li)
        })
       }
       nextBtn.addEventListener("click", ()=>{
        currentQuestionIndex++
        if (currentQuestionIndex < allQuestions.length) {
            showQuiz()
        }else{
            showResult()
        }
       })

       function selectAnswer(choice) {
        let correctAnswer = allQuestions[currentQuestionIndex].answer
        if (choice === correctAnswer) {
            score++
        }
        nextBtn.classList.remove("hidden")
       }

       function showResult() {
        questionQuiz.classList.add("hidden")
        lastResult.classList.remove("hidden")
        scoreMessageDisplay.textContent = `${score} out of ${allQuestions.length}`
       }

       restartBtn.addEventListener("click", ()=>{
        currentQuestionIndex = 0;
        score = 0;
        lastResult.classList.add("hidden")
        starQuiz()
       })

      })

    </script>
</body>
</html>
